name = "ethos-push-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Non-secret defaults for one-click deploy (Chrome/FCM reject invalid mailto subjects).
# Override with `wrangler secret put VAPID_SUBJECT` if you prefer.
[vars]
VAPID_SUBJECT = "mailto:noreply@ethos.app"

[observability]
enabled = true
head_sampling_rate = 1

# KV for subscription registration binding + rate-limit counters.
# One-click / first deploy provisions this; reuse the same Worker for updates
# (do not click Deploy to Cloudflare again under an existing project name).
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

# Optional secrets (CLI / Advanced — never commit values):
#   AUTH_TOKEN
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT  (overrides [vars] when set as a secret)
