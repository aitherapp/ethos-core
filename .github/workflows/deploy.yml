# Deploy to external public GitHub Pages repo
name: Deploy to public Pages repo

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aitherapp.github.io/ethos/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build release
        env:
          VITE_TURN_URLS: ${{ secrets.PRODUCTION_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.PRODUCTION_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.PRODUCTION_TURN_CREDENTIAL }}
        run: npm run build:release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethos-dist
          path: ./dist
          if-no-files-found: error

      - name: Prepare attestation tree
        run: cp -r dist "${{ runner.temp }}/ethos-attest"

      - name: Attest release artifact provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: ${{ runner.temp }}/ethos-attest/trust/SHA256SUMS

      - name: Record attestation in release manifest
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: node scripts/enrich-release-manifest.mjs

      - name: Verify release attestation
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r digest file; do
            [ -z "$file" ] && continue
            gh attestation verify "$file" --repo ${{ github.repository }}
          done < trust/SHA256SUMS

      - name: Deploy to external repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          publish_dir: ./dist
          publish_branch: main
          external_repository: aitherapp/ethos
          user_email: github-actions[bot]@users.noreply.github.com
          user_name: github-actions[bot]
